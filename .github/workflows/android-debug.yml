name: Android debug APK
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  build:
    runs-on: [self-hosted, Linux, ARM64, tesserae-build]
    permissions:
      contents: read
    timeout-minutes: 25
    env:
      ANDROID_HOME: /home/tesserae-ci/android-sdk
      GRADLE: /home/tesserae-ci/gradle-7.6.4/bin/gradle
    steps:
      - uses: actions/checkout@v4
      - name: Check local ARM64 build tools
        run: |
          set -eu
          echo "Architecture: $(uname -m)"
          java -version
          "$GRADLE" --version
          echo "Android SDK: ${ANDROID_HOME:-${ANDROID_SDK_ROOT:-unset}}"
          test -x "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --version
      - name: Validate Android SDK
        run: |
          test -n "${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          test -f "$ANDROID_HOME/platforms/android-33/android.jar"
          test -f "$ANDROID_HOME/build-tools/33.0.2/aapt2"
          test -x /usr/lib/android-sdk/build-tools/debian/aapt2
          /usr/lib/android-sdk/build-tools/debian/aapt2 version
      - name: Build APK using installed Gradle
        run: |
          "$GRADLE" --no-daemon \
            -Pandroid.aapt2FromMavenOverride=/usr/lib/android-sdk/build-tools/debian/aapt2 \
            :app:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: tesserae-epd42s-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
