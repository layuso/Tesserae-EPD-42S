name: Android debug APK
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  build:
    runs-on: [self-hosted, Linux, ARM64, tesserae-build]
    permissions:
      contents: read
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Check local ARM64 build tools
        run: |
          set -eu
          echo "Architecture: $(uname -m)"
          java -version
          command -v gradle
          echo "Android SDK: ${ANDROID_HOME:-${ANDROID_SDK_ROOT:-unset}}"
          command -v sdkmanager || true
      - name: Validate Android SDK
        run: |
          test -n "${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          test -d "${ANDROID_HOME:-$ANDROID_SDK_ROOT}/platforms/android-33"
      - name: Build APK using installed Gradle
        run: gradle --no-daemon :app:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: tesserae-epd42s-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
